[workspace]
members = [
    "crates/ego-core",
    "crates/ego-ai",
    "crates/ego-tools",
    "crates/ego-acp",
    "crates/ego-a2a",
    "crates/ego-listen",
    "crates/ego-mcp",
    "crates/ego-cli",
]
exclude = ["vendor/reedline"]
resolver = "3"

[workspace.package]
edition = "2024"
# Above edition 2024's own floor of 1.85 for three things, each of which was
# the binding constraint in turn:
#
# 1.86 for trait upcasting: the turn loop holds a `&dyn Fs` and has to hand
# `Tool::prepare` the narrower `&dyn PathResolver` it is a supertrait of. The
# alternatives were an `as_resolver()` method on `Fs` that exists only to
# launder a coercion, or storing both halves and letting them disagree.
#
# 1.88 for `agent-client-protocol` 2.0.0, which `ego acp` connects through.
# Below it cargo resolved the runtime to 1.0.1, which pins the schema crate to
# `=1.4.0` and conflicts irreconcilably with the version the projection needs
# (commit df9e566). maintainer approved the raise.
#
# 1.88 again for let-chains, which the parser and the config loader use — see
# `crates/ego-cli/src/cli.rs` and `src/config.rs`. Stabilised in the same
# release, so it costs nothing on top, but it means the floor cannot drop back
# to 1.86 by removing the dependency alone.
#
# 1.95 for Reedline 0.51.0, whose host-break and repaint handles are the final
# live-surface control boundary. The repository-local copy preserves that
# authoritative floor; see the 2026-08-25 live-surface dependency ADR.
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
ego-core = { path = "crates/ego-core" }
ego-listen = { path = "crates/ego-listen" }
ego-mcp = { path = "crates/ego-mcp" }
yaml-rust2 = "0.12.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
