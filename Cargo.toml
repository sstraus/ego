[workspace]
members = [
    "crates/ego-core",
    "crates/ego-ai",
    "crates/ego-tools",
    "crates/ego-acp",
    "crates/ego-a2a",
    "crates/ego-listen",
    "crates/ego-mcp",
    "crates/ego-cli",
]
exclude = ["vendor/process-wrap", "vendor/reedline", "vendor/crossterm"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
# Above edition 2024's own floor of 1.85 for three things, each of which was
# the binding constraint in turn:
#
# 1.86 for trait upcasting: the turn loop holds a `&dyn Fs` and has to hand
# `Tool::prepare` the narrower `&dyn PathResolver` it is a supertrait of. The
# alternatives were an `as_resolver()` method on `Fs` that exists only to
# launder a coercion, or storing both halves and letting them disagree.
#
# 1.88 for `agent-client-protocol` 2.0.0, which `ego acp` connects through.
# Below it cargo resolved the runtime to 1.0.1, which pins the schema crate to
# `=1.4.0` and conflicts irreconcilably with the version the projection needs
# (commit df9e566). maintainer approved the raise.
#
# 1.88 again for let-chains, which the parser and the config loader use — see
# `crates/ego-cli/src/cli.rs` and `src/config.rs`. Stabilised in the same
# release, so it costs nothing on top, but it means the floor cannot drop back
# to 1.86 by removing the dependency alone.
#
# 1.95 for Reedline 0.51.0, whose host-break and repaint handles are the final
# live-surface control boundary. The repository-local copy preserves that
# authoritative floor; see the 2026-08-25 live-surface dependency ADR.
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace.dependencies]
minijinja = { version = "=2.12.0", default-features = false, features = ["builtins", "debug", "multi_template", "fuel", "serde"] }
ego-core = { path = "crates/ego-core" }
ego-listen = { path = "crates/ego-listen" }
ego-mcp = { path = "crates/ego-mcp" }
yaml-rust2 = "0.12.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Line tables keep file:line in panic backtraces and drop only the variable and
# type data a debugger uses. Cold `cargo test --workspace --no-run` on the box:
# full DWARF passed 36 GiB of target/ after 800 s with 117 of 274 test binaries
# linked (a complete run reached 76 GiB); line tables finish in 487 s at 25 GiB.
[profile.dev]
debug = "line-tables-only"

# The process capability cache hashes the running executable (tens of MB); at
# opt-level 0 that read cost ~4.7 s per session/new in a dev build.
[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
# DEFERRED (2026-10-17) — Drop this copy when upstream fixes Escape/CPR
# ownership in src/event/source/unix/{mio,tty}.rs, Parser::advance (lines 198/247).
crossterm = { path = "vendor/crossterm" }
