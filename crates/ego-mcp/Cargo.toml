[package]
name = "ego-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3.4"
ego-core.workspace = true
futures = "0.3.34"
http = "1"
jsonschema = "0.49.9"
rmcp = { version = "=3.1.4", default-features = false, features = [
    "client",
    "request-state",
    "server",
    "transport-async-rw",
    "transport-streamable-http-client",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sse-stream = "0.2.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
url = { version = "2.5.8", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3.34"
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros"] }
uuid = "1.24.1"
