[package]
name = "ego-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ARCHITECTURE.md §2: ego-core opens no sockets and no files.
# reqwest / rusqlite / rmcp are forbidden here — enforced by this manifest,
# not by discipline.
[dependencies]
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
futures = "0.3.34"
# `net(...)` host normalisation to A-labels (same ADR, §5): an ID that differed
# by how an editor encoded a character would not be revocable from a config
# file written on another machine. Pure computation.
idna = "1"
jsonschema = { version = "0.49.9", default-features = false }
# Full bounded PNG validation. Pure computation; exact source bytes are retained.
png = "0.18.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# Instruction-file digests (docs/decisions/2026-08-21-instructions-a-workspace-
# may-hand-a-model.md §7). Deliberately not the store's xxhash64: that detects
# corruption, this has to hold up against substituted content in an export.
# Pure computation — no sockets, no files — so it fits this manifest's rule.
#
# Also rule IDs (2026-08-21-a-rule-that-means-exactly-one-thing.md §8), which
# is one crate and not two on purpose: nothing is authorised *by* an ID, so a
# second hash is surface with no payer.
sha2 = "0.10.9"
# The store codec builds the durable JSONL line bytes itself, in library code,
# so serde_json is a normal dependency rather than a dev-dependency. It is a
# pure data format: no sockets, no files. raw_value is what lets the codec
# checksum a payload's literal on-line bytes instead of a re-serialisation.
serde_json = { version = "1.0.151", features = ["raw_value"] }
toml = "1.1.4"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
zeroize = "1.9.0"

[dev-dependencies]
ego-ai = { path = "../ego-ai" }
bytes = "1.10"
trybuild = "1.0.121"

[lints]
workspace = true
