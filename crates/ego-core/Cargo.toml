[package]
name = "ego-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ARCHITECTURE.md §2: ego-core opens no sockets and no files.
# reqwest / rusqlite / rmcp are forbidden here — enforced by this manifest,
# not by discipline.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
