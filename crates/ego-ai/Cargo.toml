[package]
name = "ego-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ego-core.workspace = true
futures = "0.3.34"
bytes = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
url = "2.5.8"
# `default-features = false` is load-bearing, not tidiness: it leaves the
# `system-proxy` feature off, so `HTTP_PROXY` is never read by any code path
# that exists in the binary. `tests/http.rs` pins that this stays true.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "stream",
    "http2",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
