[package]
name = "ego-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ego-core.workspace = true
futures = "0.3.34"
bytes = "1.10"
base64 = "0.22.1"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` is declared here rather than relied on through another crate's
# feature unification: `wire/` and `pricing/` both hold a `RawValue` to keep
# bytes ego must not reinterpret — a tool call's arguments, a rate that must
# never touch an `f64` — and a build that dropped the unrelated dependency
# supplying the feature would stop compiling for a reason unrelated to either.
serde_json = { version = "1.0.151", features = ["raw_value"] }
tracing = "0.1.44"
url = "2.5.8"
# `default-features = false` is load-bearing, not tidiness: it leaves the
# `system-proxy` feature off, so `HTTP_PROXY` is never read by any code path
# that exists in the binary. `tests/http.rs` pins that this stays true.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "stream",
    "http2",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
