[package]
name = "ego-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ego-core.workspace = true
fd-lock = "4.0.4"
futures = "0.3.34"
# `0.4` and not `0.4.20`, the version `docs/04-crates.md` names: a caret range
# lets the MSRV-aware resolver pick the newest release our declared floor
# allows, instead of a number here having to be kept level with that floor by
# hand. It held us at `0.4.19` while the workspace declared 1.86, because
# `0.4.20` raised its own floor to 1.88; the workspace declares 1.88 now, so
# the same line resolves forward on its own.
globset = "0.4"
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "rustls-native-certs",
    "stream",
    "http2",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml_edit = "0.25.13"
tracing = "0.1.44"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[features]
# `NonDurableOsIo`: `OsIo` with the fsync barriers elided, for tests that
# sweep thousands of filesystem states and assert nothing about surviving a
# power loss. Behind a feature, and not merely behind a doc comment, because
# a durability-free `StoreIo` exported from the crate that *is* the
# durability contract is a hazard advice cannot close — the same reason
# `ego_core::permit::Permit` seals its constructor rather than asking
# callers not to forge one. With this off, the type does not exist to be
# misused.
#
# Enabled for this crate's own tests by the self dev-dependency below, which
# is the only supported way an integration test (a separate crate) can see a
# gated item. No non-test build turns it on.
test-support = []

[lints]
workspace = true

[dev-dependencies]
ego-tools = { path = ".", features = ["test-support"] }
