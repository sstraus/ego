[package]
name = "ego-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The crate is `ego-cli` and the binary is `ego`: the command a person types
# is not a package name, and `cargo run -p ego-cli` still finds it.
[[bin]]
name = "ego"
path = "src/main.rs"

[dependencies]
ego-ai = { path = "../ego-ai" }
ego-core.workspace = true
ego-tools = { path = "../ego-tools" }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
jsonschema = "0.49.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `signal` for the SIGINT/SIGTERM half of `CLI.md` §4.3, `time` for
# `--timeout`. `rt-multi-thread` and not `rt`: a generation and a signal
# handler have to make progress at the same time.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = "1.1.4"
tracing = "0.1.44"
url = "2.5.8"
# `v5` only: a named session's id is *derived* from the workspace and the
# name, so there is no index file to fall out of step with the sessions. Ids
# this build mints are still `SessionId::new`'s v7.
uuid = { version = "1.24.1", features = ["v5"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
