# ---------------------------------------------------------------------------
# deepseek. API-key row on DeepSeek's Chat Completions endpoint (story 1112-a347).
# Current generation: DeepSeek V4 (deepseek-v4-pro, 2026-08-13) and the Flash alias
# deepseek-flash (DeepSeek-V4.1-Flash-1017). The snapshot marks the retired
# names deepseek-v4-flash and deepseek-v4-flash-vision-exp deprecated, so they
# are not listed. Limits and efforts come from the snapshot; the vendor pages
# agree (read 2026-11-14): context "1M" and maximum output "384K" (393216) on
# https://api-docs.deepseek.com/quick_start/pricing; the thinking switch plus
# efforts low/high/max on https://api-docs.deepseek.com/guides/thinking_mode.
# Wire facts:
# - default effort `high`: "Thinking mode is enabled by default, with the default
#   effort being `high`" (thinking mode guide).
# - `reasoning_carryover = "same_provider_only"` with dialect "deepseek-chat": with
#   `tools` in the request, the `reasoning_content` of all earlier turns must be
#   sent back (thinking mode guide); `wire::deepseek` mints and replays it.
# - parallel tool calls: `parallel_tool_calls` is not in the Chat Completions
#   schema, so the mapping omits it and no guarantee is stated.
# - `cache = "none"`: cache-hit pricing exists, but no caching page was reviewed
#   for this row, so the fail-closed value stays.
# - images: excluded from this row. The vendor states vision for deepseek-flash,
#   but no image contract was reviewed; without `image_input` the row stays
#   unknown and ego refuses an image before the request.
[provider.deepseek]
models_dev = "deepseek"
floor = "2026-08-13"

[provider.deepseek.default_effort]
"deepseek-flash" = "high"
"deepseek-v4-pro" = "high"

[provider.deepseek.wire]
supports_parallel_tool_calls = false
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "deepseek-chat"
cancel = "cooperative"
cache = "none"
transport = "sse"

# Vendor-stated current aliases absent from models.dev. Never inherit API facts
# into subscription providers. Read 2026-10-15: the page states function calling,
# text/image input, text output and these limits, but no reasoning-effort set or
# parallel-call guarantee. Image admission uses the OpenAI vision guide above.
[stated."openai/chat-latest"]
source = "https://developers.openai.com/api/docs/models/chat-latest"
read = "2026-10-15"
# Responses probe 2026-10-15: POST https://api.openai.com/v1/responses with
# model=chat-latest, reasoning.effort=medium returned HTTP 200, status=completed,
# reasoning.effort=medium and output_text=ok (16 total tokens). Only Medium is
# measured; do not infer Off, Low or High. See ADR 2026-10-11, story 444-7f32.
reasoning = true
reasoning_options = [{ type = "effort", values = ["medium"] }]
limit = { context = 400000, output = 128000 }
modalities = { input = ["text", "image"], output = ["text"] }

[stated."openai/chat-latest".wire]
supports_parallel_tool_calls = false
reasoning_carryover = "unsupported"
cancel = "cooperative"
cache = "short"
transport = "sse"

[stated."openai/chat-latest".wire.image_input]
accepted_media_types = ["png", "jpeg", "webp", "gif"]
max_images = 100
