# The bootstrap model catalogue, compiled into the binary.
#
# Read `crates/ego-cli/src/facts.rs` first: this file is the *lowest* of three
# layers. `/etc/ego/models.toml` overrides it and `$EGO_HOME/models.toml`
# overrides both, per slug. Nothing here is authority over what an operator
# states; it exists so that a machine with an API key and no files can run.
#
# ## What may be written here
#
# Capability rows contain only facts read from the vendor's own published
# contract on the date each section cites. Startup defaults are explicit ego
# policy, documented separately below. **No prices.** A rate
# written from memory is a number the budget gate would trust and nothing
# could check, and `docs/decisions/2026-08-21-what-a-model-resolves-to.md` §1
# forbids it. A run with a money ceiling and no operator rates therefore still
# refuses with `NoPricingQuote`, which is the correct answer — unknown price is
# not free price.
#
# A fact nobody published stays absent. `max_tools` is omitted rather than
# guessed, `image_input = "unknown"` fails closed rather than inventing a
# media-type list. `docs/decisions/2026-08-25-...` §provenance: "Missing
# numeric or reasoning facts remain `None` or `ReasoningEffortSupport::
# Unknown`; zero, a maximum, or `Any` is never used as a presentation default."
#
# ## Which providers appear
#
# Only rows whose resolver reads supplied facts appear here: `openai`,
# `openai-codex`, `anthropic`, `openrouter` and `gemini`. The other six rows
# in `ego_ai::conformance::final_provider_rows` enumerate their own models from
# the provider (`ollama` from the daemon; `github-copilot`, `xai-oauth`,
# `kimi-coding`, `minimax-oauth` and `nous` from their subscription endpoints),
# so a row here would be a second answer to a question the provider already
# answers.
#
# `gemini` is selectable under the published-contract decision in
# `docs/decisions/2026-09-07-a-published-contract-is-enough-to-offer-a-row.md`.
# `docs/23-first-run-model-default-sources.md` records the current capability,
# replay, and default-thinking evidence used by its built-in row below.
#
# `openrouter` appears with no rows for the opposite reason: it is selectable
# and it proxies hundreds of models from dozens of vendors, changing weekly.
# Any handful chosen here would be arbitrary and stale, and the vendor
# publishes no contract this file could cite. Openrouter stays operator-
# supplied, which is what the user layer is for.
#
# ## Revision
#
# `BUILTIN_CATALOGUE_REVISION` in `facts.rs` must equal the date below, and a
# test holds that. The revision is what a retirement error names, so a stale
# constant would send an operator to the wrong catalogue.
#
# revision = 2026-09-29

# First-run policy refreshed on 2026-09-29 for gpt-6.1-sol, released that day;
# availability is still observed.
# See docs/decisions/2026-09-26-current-model-bootstrap.md.
[default_model]
openai = "openai/gpt-6.1-sol"
openai-codex = "openai-codex/gpt-6.1-sol"
anthropic = "anthropic/claude-opus-5-5"
gemini = "gemini/gemini-3.8-flash"

# ---------------------------------------------------------------------------
# openai — read 2026-09-26 from https://developers.openai.com/api/docs/models,
# https://developers.openai.com/api/docs/guides/function-calling and
# https://developers.openai.com/api/docs/guides/images-vision.
#
# Shared by every row below, and stated once here rather than in each comment:
#
# - `reasoning_carryover = "unsupported"`: the current public Responses
#   mapping refuses ego's opaque reasoning state because it has no established
#   projection for that state.
# - `max_tools` omitted: the function-calling guide gives "fewer than 20 …
#   though this is just a soft suggestion" and no hard limit. A soft
#   suggestion is not a ceiling to refuse a request against.
# - `supports_parallel_tool_calls = true`: "The model may choose to call
#   multiple functions in a single turn. You can prevent this by setting
#   `parallel_tool_calls` to `false`."
# - `cache = "short"`: prompt caching is listed as a supported feature with a
#   cached-input price, and no retention the caller controls is documented.
# - images: "PNG (.png), JPEG (.jpeg or .jpg), WEBP (.webp), and non-animated
#   GIF (.gif)"; "Up to 1,500 images per request", capped here at ego's own
#   `MAX_IMAGES_PER_PROMPT` of 100 because that is the limit a request will
#   actually meet. No per-image byte limit is published, so none is stated.

[model."openai/gpt-6-astra".capabilities]
# Context window 1,050,000; max output 128,000. Reasoning efforts: low,
# medium, high, xhigh, max — this row does not offer `none`, so `off` is
# absent from the set and a request that asks for it is refused by name.
schema_version = 5
max_context_tokens = 1050000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
cancel = "cooperative"
cache = "short"
transport = "sse"

[model."openai/gpt-6-astra".capabilities.image_input]
kind = "supported"
accepted_media_types = ["png", "jpeg", "webp", "gif"]
max_images = 100

[model."openai/gpt-6-sol".capabilities]
# Context window 1,050,000; max output 128,000. Reasoning efforts: "none, low,
# medium (default), high, xhigh, and max" — `none` is what this build spells
# `off`.
schema_version = 5
max_context_tokens = 1050000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["off", "low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "short"
transport = "sse"

[model."openai/gpt-6-sol".capabilities.image_input]
kind = "supported"
accepted_media_types = ["png", "jpeg", "webp", "gif"]
max_images = 100

[model."openai/gpt-6.1-sol".capabilities]
# Read 2026-09-29 from https://developers.openai.com/api/docs/models/gpt-6.1-sol:
# "1,050,000 context window", "128,000 max output tokens", reasoning "low,
# medium (default), high, xhigh, and max", input "text, image". Unlike
# gpt-6-sol it lists no `none`, so `off` is absent.
schema_version = 5
max_context_tokens = 1050000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "short"
transport = "sse"

[model."openai/gpt-6.1-sol".capabilities.image_input]
kind = "supported"
accepted_media_types = ["png", "jpeg", "webp", "gif"]
max_images = 100

# ---------------------------------------------------------------------------
# openai-codex — read by `ego models` after `ego auth login openai-codex`.
#
# Sources read 2026-09-26:
# - OpenAI's current gpt-6-sol model page: 1,050,000 API context / 128,000
#   maximum output.
# - The authenticated Codex model cache: 272,000 effective context for this
#   subscription surface.
#
# The subscription ceiling deliberately uses the lower authenticated value.
# See docs/decisions/2026-09-12-openai-codex-subscription-bootstrap-ceiling.md.
[model."openai-codex/gpt-6-sol".capabilities]
schema_version = 5
max_context_tokens = 272000
max_output_tokens = 128000
supports_parallel_tool_calls = false
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "none"
transport = "sse"

# Read 2026-09-29 from the authenticated Codex models cache
# (~/.codex/models_cache.json, slug `gpt-6.1-sol`): `context_window` 272000,
# `default_reasoning_level` "low", supported levels low, medium, high, xhigh,
# max and `ultra` (Codex's delegation mode, which this build has no level
# for). Max output from the API model page, as for gpt-6-sol above.
[model."openai-codex/gpt-6.1-sol".capabilities]
schema_version = 5
max_context_tokens = 272000
max_output_tokens = 128000
supports_parallel_tool_calls = false
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "low"
cancel = "cooperative"
cache = "none"
transport = "sse"

[model."openai/gpt-6-luna".capabilities]
schema_version = 5
max_context_tokens = 1050000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "unsupported"
reasoning_efforts = { only = ["off", "low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "short"
transport = "sse"

[model."openai/gpt-6-luna".capabilities.image_input]
kind = "supported"
accepted_media_types = ["png", "jpeg", "webp", "gif"]
max_images = 100

# ---------------------------------------------------------------------------
# gemini — read 2026-09-08 from the current Gemini 3.8 Flash model,
# function-calling, thinking, image-understanding, API-version and
# Interactions documentation linked from
# docs/23-first-run-model-default-sources.md.
#
# The published facts establish the two token ceilings, parallel function
# calls, low/medium/high thinking with medium as the default, streaming, and
# replay of the provider's signed thought blocks. `max_tools` and exact image
# admission limits stay unknown. Caching exists, but no long retention this
# caller controls was established, so it uses the catalogue's short class.
# Dropping this mapper's stream is cooperative cancellation; the mapper does
# not retain an interaction id through which it could claim immediate cancel.

[model."gemini/gemini-3.8-flash".capabilities]
schema_version = 5
max_context_tokens = 1048576
max_output_tokens = 65536
supports_parallel_tool_calls = true
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "gemini-interactions"
reasoning_efforts = { only = ["low", "medium", "high"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "short"
transport = "sse"

# ---------------------------------------------------------------------------
# anthropic — read 2026-09-26 from
# https://platform.claude.com/docs/en/models/overview,
# https://platform.claude.com/docs/en/build-with-claude/effort and
# https://platform.claude.com/docs/en/build-with-claude/vision.
#
# Shared by every row below:
#
# - `reasoning_carryover = "same_provider_only"` with
#   `reasoning_state_dialect = "anthropic-messages"`: thinking blocks carry a
#   signature this provider mints and only it accepts. The dialect is the tag
#   `wire::anthropic_messages::DIALECT` stamps, and the pair is what stops
#   another provider's state being replayed here.
# - `supports_parallel_tool_calls = true`: parallel tool use is the default and
#   is declined with `tool_choice.disable_parallel_tool_use`, which is the
#   parameter this build already emits.
# - `max_tools` omitted: no limit is published.
# - `cache = "long"`: prompt caching offers a 1-hour retention beside the
#   5-minute default, which is what `long` means here.
# - images: "Claude supports JPEG, PNG, GIF, and WebP images"; "The maximum
#   dimensions per image are 8000x8000 px"; "10 MB (base64-encoded) when using
#   the Claude API directly". The published per-request count is 600 (100 for
#   200k-context models); both are stated as 100 because ego's own
#   `MAX_IMAGES_PER_PROMPT` refuses above that first.

[model."anthropic/claude-fable-5-1".capabilities]
# Context window 1M; max output 128K. Effort: low, medium, high (default),
# xhigh, max. Adaptive thinking is always on, so `off` is unavailable.
schema_version = 5
max_context_tokens = 1000000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "anthropic-messages"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "high"
cancel = "cooperative"
cache = "long"
transport = "sse"

[model."anthropic/claude-fable-5-1".capabilities.image_input]
kind = "supported"
accepted_media_types = ["jpeg", "png", "gif", "webp"]
max_images = 100
max_bytes_per_image = 10485760
max_width = 8000
max_height = 8000

[model."anthropic/claude-opus-5-5".capabilities]
# Context window 1M; max output 128K. Effort: low, medium (default), high,
# xhigh, max. Adaptive thinking is always on, so `off` is unavailable.
schema_version = 5
max_context_tokens = 1000000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "anthropic-messages"
reasoning_efforts = { only = ["low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "medium"
cancel = "cooperative"
cache = "long"
transport = "sse"

[model."anthropic/claude-opus-5-5".capabilities.image_input]
kind = "supported"
accepted_media_types = ["jpeg", "png", "gif", "webp"]
max_images = 100
max_bytes_per_image = 10485760
max_width = 8000
max_height = 8000

[model."anthropic/claude-sonnet-5".capabilities]
# Context window 1M; max output 128K. Effort: low, medium, high (default),
# xhigh, max.
schema_version = 5
max_context_tokens = 1000000
max_output_tokens = 128000
supports_parallel_tool_calls = true
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "anthropic-messages"
reasoning_efforts = { only = ["off", "low", "medium", "high", "xhigh", "max"] }
default_reasoning_effort = "high"
cancel = "cooperative"
cache = "long"
transport = "sse"

[model."anthropic/claude-sonnet-5".capabilities.image_input]
kind = "supported"
accepted_media_types = ["jpeg", "png", "gif", "webp"]
max_images = 100
max_bytes_per_image = 10485760
max_width = 8000
max_height = 8000

[model."anthropic/claude-haiku-4-5".capabilities]
# Context window 200K; max output 64K. The alias, which resolves to the pinned
# `claude-haiku-4-5-20251001`; write the pinned id in your own file if you
# need the snapshot named in the request.
#
# `reasoning_efforts = ["off"]` and that is not an omission. This model is
# absent from the effort parameter's supported-model list, so every level
# above `off` would be sent as a value it rejects. `off` is expressible
# because it is the absence of the parameter.
schema_version = 5
max_context_tokens = 200000
max_output_tokens = 64000
supports_parallel_tool_calls = true
reasoning_carryover = "same_provider_only"
reasoning_state_dialect = "anthropic-messages"
reasoning_efforts = { only = ["off"] }
default_reasoning_effort = "off"
cancel = "cooperative"
cache = "long"
transport = "sse"

[model."anthropic/claude-haiku-4-5".capabilities.image_input]
kind = "supported"
accepted_media_types = ["jpeg", "png", "gif", "webp"]
max_images = 100
max_bytes_per_image = 10485760
max_width = 8000
max_height = 8000

# ---------------------------------------------------------------------------
# Tombstones.
#
# A slug removed from the builtin catalogue. Without these, `--model
# anthropic/claude-3-opus-20240229` is answered with "no capabilities are
# configured", which sends someone to write a `models.toml` entry for a model
# that may not answer. With them the refusal names the retirement and
# a replacement.
#
# `replacement` need not be in this catalogue. For historical Anthropic
# tombstones, `retired` is the provider shutdown date. For superseded builtin
# rows, it is the date ego removed the row.
#
# Read 2026-09-07 from
# https://platform.claude.com/docs/en/about-claude/model-deprecations.

# These slugs left the builtin catalogue on 2026-09-26. This date records
# ego's catalogue change, not a claim that the provider stopped serving them.
[retired."openai/gpt-5.6-sol"]
replacement = "openai/gpt-6-sol"
retired = "2026-09-26"

[retired."openai-codex/gpt-5.6-sol"]
replacement = "openai-codex/gpt-6-sol"
retired = "2026-09-26"

