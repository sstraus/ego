# Builtin model defaults and tombstones; generated capabilities live in `models.generated.toml`.
#
# System and user model files override this weakest layer per slug. Builtin capabilities contain
# published facts, not prices or invented unknown values. `policy.toml` and
# `scripts/catalogue.py` select current generations; retired builtin rows retain tombstones.
#
# Supplied providers enumerate configured rows. Discovery providers obtain their own catalogues.
# OpenRouter stays dynamic rather than carrying an arbitrary builtin subset.
#
# `BUILTIN_CATALOGUE_REVISION` in `facts.rs` must equal the revision below.
# revision = 2026-10-15

# First-run policy refreshed for gpt-6.1-sol on 2026-09-29.
# Availability is still checked at runtime.
[default_model]
openai = "openai/gpt-6.1-sol"
openai-codex = "openai-codex/gpt-6.1-sol"
anthropic = "anthropic/claude-opus-5-5"
gemini = "gemini/gemini-3.8-flash"

# ---------------------------------------------------------------------------
# Tombstones.
#
# A slug removed from the builtin catalogue. Without these, `--model
# anthropic/claude-3-opus-20240229` is answered with "no capabilities are
# configured", which sends someone to write a `models.toml` entry for a model
# that may not answer. With them the refusal names the retirement and
# a replacement.
#
# `replacement` need not be in this catalogue. For historical Anthropic
# tombstones, `retired` is the provider shutdown date. For superseded builtin
# rows, it is the date ego removed the row.
#
# Read 2026-09-07 from
# https://platform.claude.com/docs/en/about-claude/model-deprecations.

# These slugs left the builtin catalogue on 2026-09-26. This date records
# ego's catalogue change, not a claim that the provider stopped serving them.
[retired."openai/gpt-5.6-sol"]
replacement = "openai/gpt-6-sol"
retired = "2026-09-26"

[retired."openai-codex/gpt-5.6-sol"]
replacement = "openai-codex/gpt-6-sol"
retired = "2026-09-26"

[retired."openai/gpt-5.6-terra"]
replacement = "openai/gpt-6-luna"
retired = "2026-09-26"

[retired."openai/gpt-5.6-luna"]
replacement = "openai/gpt-6-luna"
retired = "2026-09-26"

[retired."anthropic/claude-opus-5"]
replacement = "anthropic/claude-opus-5-5"
retired = "2026-09-26"

[retired."anthropic/claude-opus-4-1-20250805"]
replacement = "anthropic/claude-opus-5-5"
retired = "2026-08-05"

[retired."anthropic/claude-opus-4-20250514"]
replacement = "anthropic/claude-opus-5-5"
retired = "2026-06-15"

[retired."anthropic/claude-sonnet-4-20250514"]
replacement = "anthropic/claude-sonnet-5-5"
retired = "2026-06-15"

[retired."anthropic/claude-3-7-sonnet-20250219"]
replacement = "anthropic/claude-sonnet-5-5"
retired = "2026-02-19"

[retired."anthropic/claude-3-5-haiku-20241022"]
replacement = "anthropic/claude-haiku-5-5"
retired = "2026-02-19"

[retired."anthropic/claude-3-haiku-20240307"]
replacement = "anthropic/claude-haiku-5-5"
retired = "2026-04-20"

[retired."anthropic/claude-3-5-sonnet-20240620"]
replacement = "anthropic/claude-sonnet-5-5"
