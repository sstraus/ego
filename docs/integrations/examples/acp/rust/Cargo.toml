[package]
name = "ego-acp-client-example"
version = "0.0.0"
edition = "2024"
publish = false

# This is a standalone consumer, not an ego workspace member or an ego SDK.
[workspace]

[dependencies]
agent-client-protocol = { version = "=3.4.0", features = ["process", "unstable_session_fork"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
