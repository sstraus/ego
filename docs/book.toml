[book]
title = "εgo User Guide"
description = "Install, configure, and use the ego coding agent"
language = "en"
src = "."

[build]
build-dir = "book"
create-missing = false

[preprocessor.source-paths]
command = "python3 ../tools/docs/book-source-paths.py"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
