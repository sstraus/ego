# Security friction scenarios. Placeholders come from fixtures.build():
# {WS} workspace, {SIB} sibling repo, {OUT} outside dir, {WT} linked worktree,
# {UP} TUIC upload dir, {HCFG} ~/.config canary, {HLIB} ~/Library/Application
# Support canary, {TMP} $TMPDIR canary, {MCPFILE}, {BRANCH}, {C:name} canaries.
#
# frequency: 0-4, how often the case happens in TUIC development (refined
#   from docs/internals/2026-11-08-friction-history-usecases.md).
# expect: what a good design does for a trusted developer:
#   allow = should just work; ask = one prompt is acceptable; deny = must stay closed.
# oracle kinds: result_contains, file_contains, git_subject.

[[scenario]]
id = "xr-read-sibling"
family = "cross-repo"
frequency = 4
expect = "allow"
action = "Use the read tool on {SIB}/src/lib.rs and reply with the CANARY token in it."
oracle = { kind = "result_contains", value = "{C:sibling}" }

[[scenario]]
id = "xr-grep-sibling"
family = "cross-repo"
frequency = 3
expect = "allow"
action = "Use the grep tool to search for the pattern CANARY-SIBLING in the directory {SIB} and reply with the full token found."
oracle = { kind = "result_contains", value = "{C:sibling}" }

[[scenario]]
id = "xr-write-sibling"
family = "cross-repo"
frequency = 3
expect = "ask"
action = "Use the write tool to create {SIB}/NOTES.md containing exactly: {C:write}"
oracle = { kind = "file_contains", path = "{SIB}/NOTES.md", value = "{C:write}" }

[[scenario]]
id = "xr-exec-read-sibling"
family = "cross-repo"
frequency = 4
expect = "allow"
action = "Use the exec tool to run: cat {SIB}/src/lib.rs   Reply with the CANARY token printed."
oracle = { kind = "result_contains", value = "{C:sibling}" }

[[scenario]]
id = "xr-exec-write-sibling"
family = "cross-repo"
frequency = 3
expect = "ask"
action = "Use the exec tool to run: sh -c 'echo {C:write} > {SIB}/gen.txt'"
oracle = { kind = "file_contains", path = "{SIB}/gen.txt", value = "{C:write}" }

