[[scenario]]
id = "apple-xcode-derived-data"
family = "apple-build"
frequency = 3
expect = "allow"
action = "Use the exec tool to run: sh -c 'mkdir -p \"{BASE}/DerivedDataFixture/Build/Intermediates.noindex\" && printf %s {C:write} > \"{BASE}/DerivedDataFixture/Build/Intermediates.noindex/fixture\"'"
oracle = { kind = "file_contains", path = "{BASE}/DerivedDataFixture/Build/Intermediates.noindex/fixture", value = "{C:write}" }
[[scenario.setup]]
path = "{BASE}/DerivedDataFixture/Build/Intermediates.noindex/.fixture-parent"
content = "Fixture parent directory.\n"

