[[scenario.setup]]
path = "{WS}/package.json"
content = "{\"name\":\"fixture\",\"version\":\"1.0.0\",\"private\":true,\"scripts\":{\"build\":\"node build.cjs\"}}\n"
[[scenario.setup]]
path = "{WS}/build.cjs"
content = "const fs=require('fs');fs.mkdirSync('dist',{recursive:true});fs.copyFileSync('src/main.js','dist/main.js');\n"
[[scenario.setup]]
path = "{WS}/src/main.js"
content = "console.log(\"{C:build}\");\n"

