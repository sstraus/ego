[[scenario]]
id = "orch-cross-report-read"
family = "cross-repo"
frequency = 3
expect = "allow"
action = "Use the read tool on {SIB}/reports/sample.md and reply with its CANARY token."
oracle = { kind = "result_contains", value = "{C:report}" }
[[scenario.setup]]
path = "{SIB}/reports/sample.md"
content = "{C:report}\n"

[[scenario]]
id = "orch-cross-report-write"
family = "cross-repo"
frequency = 2
expect = "allow"
action = "Use the write tool to create {SIB}/reports/generated.md containing exactly {C:write}."
oracle = { kind = "file_contains", path = "{SIB}/reports/generated.md", value = "{C:write}" }
[[scenario.setup]]
path = "{SIB}/reports/.fixture-parent"
content = "Fixture parent directory.\n"

